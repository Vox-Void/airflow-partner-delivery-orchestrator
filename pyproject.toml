[project]
name = "airflow-partner-delivery-orchestrator"
version = "0.1.0"
description = "Schedule and reconcile synthetic partner delivery reports"
requires-python = ">=3.11,<3.13"
dependencies = ["psycopg[binary]==3.3.6", "tzdata==2026.6"]

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partner_delivery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
